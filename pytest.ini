[pytest]
testpaths = tests
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
addopts = --strict-markers --cov=src --cov-report=term-missing:skip-covered --cov-report=xml:coverage.xml --cov-fail-under=85
markers =
    integration: requires dedicated PostgreSQL test database and Redis
    unit: isolated tests that do not connect to external services
