[pytest]
testpaths = tests
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function

addopts =
    --cov=src
    --cov-report=term-missing:skip-covered
    --cov-report=xml:coverage.xml
    --cov-fail-under=85

markers =
    integration: tests requiring PostgreSQL and Redis
    unit: isolated unit tests