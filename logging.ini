[loggers]
keys=root,uvicorn,sqlalchemy
[handlers]
keys=console
[formatters]
keys=standard
[logger_root]
level=INFO
handlers=console
[logger_uvicorn]
level=INFO
qualname=uvicorn
handlers=console
propagate=0
[logger_sqlalchemy]
level=WARN
qualname=sqlalchemy.engine
handlers=console
propagate=0
[handler_console]
class=StreamHandler
args=(sys.stdout,)
level=INFO
formatter=standard
[formatter_standard]
format=%(asctime)s %(levelname)s %(name)s %(message)s
